name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          CALVER=$(date -u +"%Y-%m-%d")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${CALVER}+${SHORT_SHA}" >> $GITHUB_OUTPUT

  build-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS
        run: |
          cargo build --release
          tar -czf ranger-aarch64-apple-darwin.tar.gz -C target/release ranger

      - uses: actions/upload-artifact@v4
        with:
          name: ranger-aarch64-apple-darwin
          path: ranger-aarch64-apple-darwin.tar.gz

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          cross build --release --target aarch64-unknown-linux-gnu
          tar -czf ranger-aarch64-unknown-linux-gnu.tar.gz -C target/aarch64-unknown-linux-gnu/release ranger

      - uses: actions/upload-artifact@v4
        with:
          name: ranger-aarch64-unknown-linux-gnu
          path: ranger-aarch64-unknown-linux-gnu.tar.gz

  publish:
    needs: [version, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            ranger-aarch64-apple-darwin.tar.gz \
            ranger-aarch64-unknown-linux-gnu.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

  dotslash:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: facebook/dotslash-publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .github/workflows/dotslash-config.json
          tag: v${{ needs.version.outputs.version }}
