name: CI

on: # zizmor: ignore[dangerous-triggers] -- only triggers on main pushes from the quire mirror; no fork PR risk.
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - run: |
          curl -sL https://github.com/facebook/dotslash/releases/download/v0.5.9/dotslash-linux-musl.x86_64.tar.gz |
            tar xz -C /usr/local/bin
      - run: echo "$PWD/bin" >> "$GITHUB_PATH"

      - run: rustup component add clippy rustfmt llvm-tools
      - run: cargo fmt --check
      - run: just clippy coverage

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - run: |
          curl -sL https://github.com/facebook/dotslash/releases/download/v0.5.9/dotslash-linux-musl.x86_64.tar.gz |
            tar xz -C /usr/local/bin
      - run: echo "$PWD/bin" >> "$GITHUB_PATH"

      - run: zizmor .github

  version:
    needs: [ci, zizmor]
    runs-on: ubuntu-latest
    permissions:
      contents: read # look up existing releases.
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - name: Calculate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y-%m-%d)+${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build macOS
        run: |
          cargo build --release
          tar -czf ranger-aarch64-apple-darwin.tar.gz -C target/release ranger

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ranger-aarch64-apple-darwin
          path: ranger-aarch64-apple-darwin.tar.gz

  build-linux:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-unknown-linux-gnu, x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build Linux
        env:
          TARGET: ${{ matrix.target }}
        # cross for both targets so they link against the same glibc baseline.
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          cross build --release --target "$TARGET"
          tar -czf "ranger-$TARGET.tar.gz" -C "target/$TARGET/release" ranger

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ranger-${{ matrix.target }}
          path: ranger-${{ matrix.target }}.tar.gz

  publish:
    needs: [version, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Publish
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            ranger-aarch64-apple-darwin.tar.gz \
            ranger-aarch64-unknown-linux-gnu.tar.gz \
            ranger-x86_64-unknown-linux-gnu.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}

  dotslash:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # zizmor: ignore[artipacked] -- dotslash-publish-release needs credentials to push a commit.
      - uses: facebook/dotslash-publish-release@2539c4d8ae00a42773306c8731d2dd3724d979d2 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .github/workflows/dotslash-config.json
          tag: ${{ needs.version.outputs.tag }}
